name: Comprobar código y preparador
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  codigo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pillow==12.3.0 numpy==1.26.4 opencv-python==4.11.0.86 shapely==2.1.2
      - run: python -m compileall -q Laboratorio/Modelos Laboratorio/Datos Aplicacion Laboratorio/Reproducibilidad
      - run: python -m unittest discover -s Laboratorio/Datos -v
      - run: python -m unittest discover -s Laboratorio/Reproducibilidad/tests -v
      - run: python -m unittest discover -s Aplicacion -v
      - run: python Laboratorio/Reproducibilidad/verificar_publicacion.py
