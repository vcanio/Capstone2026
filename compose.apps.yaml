name: walmart-vision-pruebas
services:
  equipo:
    image: walmart-vision-apps:local
    build:
      context: ./Aplicacion
    init: true
    ports:
      - "127.0.0.1:8095:8095"
    command: ["python", "app.py", "--host", "0.0.0.0", "--port", "8095", "--device", "cpu"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
  cliente:
    image: walmart-vision-apps:local
    build:
      context: ./Aplicacion
    init: true
    ports:
      - "127.0.0.1:8098:8098"
    volumes:
      - ./Aplicacion_Cliente:/app/Aplicacion_Cliente:ro
    environment:
      PYTHONPATH: /app/Walmart_Vision
      VISION_PORT: "8098"
    command: ["python", "/app/Aplicacion_Cliente/app_cliente.py", "--app-dir", "/app/Walmart_Vision", "--host", "0.0.0.0", "--port", "8098", "--device", "cpu"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
