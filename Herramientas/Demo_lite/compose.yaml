name: walmart-vision
services:
  vision:
    image: walmart-vision:local
    build:
      context: .
    init: true
    ports:
      - "127.0.0.1:${VISION_PORT:-8095}:${VISION_PORT:-8095}"
    environment:
      VISION_PORT: "${VISION_PORT:-8095}"
    command: ["python", "app.py", "--host", "0.0.0.0", "--port", "${VISION_PORT:-8095}", "--device", "cpu"]
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
