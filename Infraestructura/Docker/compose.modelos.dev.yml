# Código local: panel.html se relee en cada petición; Python requiere reiniciar el servicio.
services:
  panel_modelos:
    # También permite usar una imagen local anterior cuyo CMD apunta a Herramientas/.
    command: ["python", "-u", "Laboratorio/Modelos/panel_modelos.py", "--host", "0.0.0.0"]
    volumes:
      - type: bind
        source: ../../Laboratorio/Modelos
        target: /app/Laboratorio/Modelos
        read_only: true
        bind:
          create_host_path: false
