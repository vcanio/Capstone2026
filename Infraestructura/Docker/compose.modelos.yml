name: walmart-modelos
services:
  panel_modelos:
    image: walmart-panel-modelos:local
    build:
      context: ../..
      dockerfile: Laboratorio/Modelos/docker/Dockerfile
    restart: always
    init: true
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      CVAT_ENABLED: ${MODEL_CVAT_ENABLED:-false}
      CVAT_URL: ${MODEL_CVAT_URL:-http://host.docker.internal:8082/api}
      CVAT_HOST_HEADER: ${MODEL_CVAT_HOST_HEADER-localhost:8082}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: ../../Datos
        target: /app/Datos
        bind:
          create_host_path: false
      - type: bind
        source: ../../Datos/V1
        target: /app/Datos/V1
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../Datos/V2
        target: /app/Datos/V2
        read_only: true
        bind:
          create_host_path: false
      # Las rutas históricas V2 se montan desde sus ubicaciones físicas en V3.
      - type: bind
        source: ../../Datos/V3/lider_express_20261016
        target: /app/Datos/V2/lider_express_20261016
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../Datos/V3/visibilidad_limitada_20261019
        target: /app/Datos/V2/visibilidad_limitada_20261019
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ../../Datos/V3/lider_express_20261016
        target: /app/Datos/V3/lider_express_20261016
        read_only: true
